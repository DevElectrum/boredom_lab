name: Verify and publish Warranty Void

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game JavaScript syntax
        run: |
          node --check warranty-void/engine.js
          node --check warranty-void/game.js
      - name: Run game tests
        run: node --test warranty-void/tests/*.test.cjs
      - name: Detect whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "200" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Pages is enabled; deployment may proceed.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Pages is not enabled. Tests can pass; enable GitHub Pages in Settings > Pages to deploy.'
          fi

  publish:
    needs: verify
    if: needs.verify.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Allow artifact indexing
        run: sleep 12
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
